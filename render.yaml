services:
  - type: web
    name: mkmoon
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: HEARTBEAT_MINUTES
        value: 30
      - key: STATUS_KEY
        generateValue: true
      - key: TIER_B_ENABLED
        value: "1"
